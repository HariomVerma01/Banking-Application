spring.datasource.url=jdbc:mysql://localhost:3306/easybank
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

spring.config.activate.on-profile=prod

logging.level.org.springframework.security=${Security_Log:ERROR}
logging.pattern.console=${LogPattern_Console:%style{%d{HH:mm:ss}}{green} %style{%-5level}{blue} %style{[%thread]}{red} %style{%logger}{yellow} - %msg%n}
spring.security.user.name=${User_Name:admin}
spring.security.user.password=${User_Password:12345}

spring.servelt.session.timeout=${SESSION_TIMEOUT:20M}